; Uploads: the hub advertises a 4 MB limit (AI_HUB_MAX_UPLOAD_KB); PHP's stock 2 MB default would reject valid phone photos first.
upload_max_filesize = 8M
post_max_size = 10M
memory_limit = 256M
max_execution_time = 60

; The official php:apache image ships with no php.ini at all, so these fall back to PHP's compiled-in defaults —
; notably display_errors=On. Any warning or deprecation notice would then be echoed straight into the response
; body before headers are sent, which crashes every request with "headers already sent". Send errors to the
; log (stderr, matching LOG_CHANNEL) instead of the response.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
