<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
    </Directory>

    # Set directly on the vhost so it applies regardless of whether conf.d/*.ini loaded for this SAPI.
    # The official php:apache image ships with no php.ini at all, so display_errors otherwise falls back
    # to PHP's compiled-in default (On), which echoes warnings/deprecations into the response body before
    # headers are sent -- corrupting every request with a "headers already sent" fatal.
    php_admin_flag display_errors Off
    php_admin_flag display_startup_errors Off
    php_admin_flag log_errors On
    php_admin_value error_log /dev/stderr

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
